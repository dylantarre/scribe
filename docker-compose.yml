services:
  transcription:
    build: .
    container_name: youtube-transcription
    volumes:
      - transcripts:/app/transcripts  # Persist transcripts
      - database:/app  # Persist database
      - config:/app/config  # Store configuration
    environment:
      - TZ=UTC
    restart: always
    # Override the default command if needed
    command: python monitor.py  # Run monitor.py to continuously check for new videos
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import sqlite3; sqlite3.connect('/app/latest_videos.db').execute('select 1'); print('ok')\" || exit 1"]
      interval: 60s
      timeout: 20s
      retries: 3
      start_period: 90s
    stop_grace_period: 60s
    mem_limit: 6g
    cpus: 3.0
    logging:
      driver: json-file
      options:
        max-size: "25m"
        max-file: "5"
    labels:
      - "com.centurylinklabs.watchtower.enable=true"  # Enable auto-updates with Watchtower if you use it
      - "traefik.enable=false"  # Disable Traefik routing as this is a background service
      - "autoheal=true"

  autoheal:
    image: willfarrell/autoheal:latest
    container_name: autoheal
    restart: always
    environment:
      - AUTOHEAL_CONTAINER_LABEL=autoheal
      - AUTOHEAL_INTERVAL=30
      - AUTOHEAL_START_PERIOD=120
      - AUTOHEAL_DEFAULT_STOP_TIMEOUT=60
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  transcripts:  # Named volume for transcripts
    driver: local
  database:  # Named volume for database
    driver: local
  config:  # Named volume for configuration
    driver: local 

version: '3.8'

services:
  transcriber:
    build: .
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1
      - PYTORCH_ENABLE_MPS_FALLBACK=1
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 2G
